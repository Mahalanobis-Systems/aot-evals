# Public agent benchmarks: the local catalog Phase 1 matches an agent against.
# Fields and vocabularies: references/benchmarks.md. Validated by tests/test_benchmarks.py.
# Add an entry with every field filled; `null` for a number nobody has published.

- id: contextcrbench
  name: ContextCRBench
  year: 2025
  by: ByteDance and Harbin Institute of Technology (Hu et al.)
  workloads:
  - code-review
  task_types:
  - judge whether a diff hunk needs review comments
  - point to the exact lines with defects
  - write the review comment a human would leave, given the linked issue and surrounding code
  interaction: single-turn
  environment: static
  state_checked: false
  tools:
  - none
  grading:
  - programmatic-check
  - llm-judge
  size: 67910
  data: real-scraped
  pii: possible
  license: unknown
  harness:
  - own-repo
  status: active
  links:
    paper: https://arxiv.org/abs/2511.07017
    github: https://github.com/kinesiatricssxilm14/ContextCRBench
    leaderboard: null
  good_for:
  - taxonomy
  - case-template
  fit: Fits teams building a review bot with issue context; borrow the three granularities (hunk, line,
    comment) as a taxonomy and the context-enrichment fields per record.
  caveats: Scraped from 100 public repos with no stated license and reviewer names possibly included;
    metrics are not described in the README; very large so sample it.
- id: swe-prbench
  name: SWE-PRBench
  year: 2026
  by: Deepak Kumar
  workloads:
  - code-review
  task_types:
  - find the issues a human reviewer flagged in a pull request diff
  - review with diff only, diff plus files, or full repository context
  interaction: single-turn
  environment: static
  state_checked: false
  tools:
  - none
  grading:
  - llm-judge
  size: 350
  data: real-public
  pii: possible
  license: CC-BY-4.0
  harness:
  - none
  status: active
  links:
    paper: https://arxiv.org/abs/2603.26130
    github: null
    leaderboard: null
  good_for:
  - grading-design
  - taxonomy
  fit: Fits code-review agents that choose how much context to load; its finding that more context lowered
    every model's score is directly useful for prompt design.
  caveats: Single author, LLM-judged (kappa 0.75), and the repository URL is not on the paper page; models
    found only 15 to 31 percent of issues, so scores cluster near the floor.
