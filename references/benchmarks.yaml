  - resolve the issue once the missing detail is supplied
  interaction: multi-turn-simulated-user
  environment: containers
  state_checked: true
  tools:
  - shell
  - code editing
  - test runner
  grading:
  - unit-tests
  size: null
  data: real-public
  pii: none
  license: unknown
  harness:
  - none
  status: active
  links:
    paper: https://arxiv.org/abs/2603.26233
    github: null
    leaderboard: null
