- id: aider-polyglot
  name: Aider polyglot benchmark
  year: 2024
  by: Aider (Paul Gauthier)
  workloads:
  - coding
  task_types:
  - solve an Exercism exercise in C++, Go, Java, JavaScript, Python or Rust by editing files
  - fix the solution after seeing test failures on a second attempt
  interaction: multi-turn-scripted
  environment: containers
  state_checked: true
  tools:
  - file editor
  - test runner
  grading:
  - unit-tests
  size: 225
  data: real-public
  pii: none
  license: unknown
  harness:
  - own-repo
  status: active
  links:
    paper: https://aider.chat/2024/12/21/polyglot.html
    github: https://github.com/Aider-AI/polyglot-benchmark
    leaderboard: https://aider.chat/docs/leaderboards/
  good_for:
  - baseline
  - grading-design
  fit: Fits chat-style code editing tools that apply diffs to files; borrow the two-attempt protocol (pass
    rate 1 vs 2) that measures recovery from test feedback.
  caveats: Top models are near 88 percent so headroom is small; exercises are public Exercism problems
    (likely memorized) and the content license belongs to Exercism.
